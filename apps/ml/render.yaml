services:
  - type: web
    name: shopguard-ml
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ML_MODEL_DIR
        value: /tmp/shopguard_models
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /health
